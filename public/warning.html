<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنبيه - شبكة حكايات نت</title>
  <style>
    body { font-family: Tahoma, Cairo, sans-serif; background: #fff8f8; text-align: center; padding: 50px 20px; direction: rtl; }
    .card { background: white; max-width: 450px; margin: auto; padding: 35px; border-radius: 14px; box-shadow: 0 6px 20px rgba(231,76,60,0.15); border-top: 5px solid #e74c3c; }
    .icon { font-size: 55px; color: #e74c3c; margin-bottom: 15px; }
    h1 { color: #c0392b; font-size: 22px; margin-bottom: 15px; }
    p { color: #555; font-size: 15px; line-height: 1.6; margin-bottom: 25px; }
    .btn { display: inline-block; background: #01338D; color: white; padding: 12px 28px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: background 0.3s; }
    .btn:hover { background: #001f5c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>برقية تنبيه وتوضيح</h1>
    <p>عذراً، لم يتم تحديد الفرع المطلوب بدقة أو أن اختيارك غير صالح. يرجى العودة للخلف، التأكد من اختيار الفرع المناسب من القائمة، ثم المحاولة مرة أخرى.</p>
    <a href="/" class="btn">العودة وإعادة المحاولة</a>
  </div>
</body>
</html>
