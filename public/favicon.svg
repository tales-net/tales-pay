<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- تدرج لوني عميق وآمن للخلفية والدرع (أزرق ملكي متطور) -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <!-- تدرج ذهبي فخم يبرز حرف T وبطاقة الدفع -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- درع الأمان الرئيسي الكبير الذي يشمل الأيقونة بالكامل (يدل على الدفع الآمن) -->
  <path d="M32 4 C48 4 56 10 56 26 C56 42 42 54 32 60 C22 54 8 42 8 26 C8 10 16 4 32 4 Z" fill="url(#shieldBg)" stroke="#60a5fa" stroke-width="2" />

  <!-- لمسة تقنية تعبر عن بطاقة الدفع في الخلفية بشفافية خفيفة -->
  <rect x="16" y="20" width="32" height="22" rx="4" fill="#ffffff" opacity="0.12" />

  <!-- حرف T البارز والضخم في المنتصف بلون ذهبي لامع ليميز اسم Tales والدفع الفاخر -->
  <path d="M22 19 H42 M32 19 V43" stroke="url(#goldAcc)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- نقطة أو شريحة ذكية لامعة أسفل الحرف لتكتمل هُوية الدفع الإلكتروني -->
  <circle cx="32" cy="48" r="3" fill="#34d399" />
</svg>
