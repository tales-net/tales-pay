<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tales - دفع محفظة فودافون كاش</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="payment-header">
        <h1>الدفع بواسطة فودافون كاش</h1>
    </header>

    <div class="container">
        <div class="checkout-card">
            <section class="card-inputs">
                
                <form id="vodafone_form">
                    <input type="hidden" name="payment_method" value="wallet">
                    <input type="hidden" name="branch" value="branch2">

                    <div class="input-group-custom">
                        <label for="user_phone"><i class="fa fa-phone" aria-hidden="true"></i> رقم محفظة فودافون:</label>
                        <div class="input-wrapper">
                            <input placeholder="010XXXXXXXX" type="text" inputmode="numeric" name="phone" id="user_phone" maxlength="11" required>
                        </div>
                    </div>

                    <div class="input-group-custom">
                        <label for="pay_amount">المبلغ (بالجنيه):</label>
                        <div class="input-wrapper">
                            <input placeholder="أدخل المبلغ المطلوب" type="text" inputmode="numeric" name="amount" id="pay_amount" required>
                        </div>
                    </div>

                    <div class="card-footer-box">
                        <button type="submit" id="submitButton" class="submit-btn">
                            متابعة وتأكيد الدفع من المحفظة
                        </button>
                    </div>
                </form>

            </section>
        </div>
    </div>

    <script>
        document.getElementById('vodafone_form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitButton');
            const phone = document.getElementById('user_phone').value;
            const amount = document.getElementById('pay_amount').value;

            btn.disabled = true;
            btn.innerText = 'جاري الاتصال بـ Paymob وإرسال طلب المحفظة...';

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: phone,
                        amount: amount,
                        payment_method: 'wallet',
                        branch: 'branch2'
                    })
                });

                const data = await response.json();

                if (data.success && data.payment_url) {
                    // التوجيه لرابط البوابة لكي يدخل المستخدم وستقوم الشركة بإرسال OTP حقيقي له
                    window.location.href = data.payment_url;
                } else {
                    alert(data.error || 'حدث خطأ أثناء معالجة الدفع.');
                    btn.disabled = false;
                    btn.innerText = 'متابعة وتأكيد الدفع من المحفظة';
                }
            } catch (err) {
                alert('فشل الاتصال بالسيرفر، تأكد من الشبكة.');
                btn.disabled = false;
                btn.innerText = 'متابعة وتأكيد الدفع من المحفظة';
            }
        });
    </script>
</body>
</html>
