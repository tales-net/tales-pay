<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>بيانات الدفع الآمن - شبكة حكايات</title>

    <!-- FontAwesome & Bootstrap Grid CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap-grid.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        .payment-header {
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 1.5rem;
        }

        .payment-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #01338D;
        }

        .checkout-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 25px;
            max-width: 480px;
            margin: 0 auto 30px auto;
        }

        .input-group-custom {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group-custom label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input, .input-group-custom select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: left;
            direction: ltr;
            box-sizing: border-box;
        }

        .input-group-custom select {
            text-align: right;
            direction: rtl;
            background: #fff;
        }

        .input-wrapper input:focus, .input-group-custom select:focus {
            border-color: #01338D;
            box-shadow: 0 0 0 3px rgba(1, 51, 141, 0.15);
        }

        .input-wrapper input.is-invalid {
            border-color: #dc3545 !important;
        }

        .input-icon-right {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            background: #fff;
            padding-left: 5px;
        }

        .input-icon-right .meeza-badge {
            background: #004a99;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .input-icon-right .cash-icon {
            color: #28a745;
            font-size: 18px;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            text-align: right;
            direction: rtl;
        }

        .card-footer-box {
            text-align: center;
            margin-top: 20px;
        }

        .submit-btn {
            background-color: #01338D;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .submit-btn:hover {
            background-color: #002266;
        }

        .submit-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .secured-tag {
            display: block;
            margin-top: 12px;
            font-size: 12px;
            color: #777;
        }

        footer {
            padding: 25px 0 35px 0;
            background: #ffffff;
            border-top: 1px solid #e9ecef;
            margin-top: 25px;
        }

        .bank-logos-container {
            text-align: center;
        }

        .bank-logos-title {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .bank-logos-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .bank-logo-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            height: 48px;
        }

        .bank-logo-card img {
            max-height: 32px;
            max-width: 90px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <header class="payment-header">
        <h1>إتمام الدفع الإلكتروني - شبكة حكايات</h1>
    </header>

    <div class="container">
        <div class="checkout-card">
            <section class="card-inputs">
                <form id="paymob_checkout" novalidate>

                    <!-- 1. اختيار وسيلة الدفع -->
                    <div class="input-group-custom">
                        <label for="payment_method">اختر وسيلة الدفع:</label>
                        <select name="payment_method" id="payment_method" required>
                            <option value="wallet" selected>محفظة إلكترونية (Mobile Wallet)</option>
                            <option value="card">بطاقة بنكية (Visa / Mastercard)</option>
                        </select>
                    </div>

                    <!-- 2. قيمة المبلغ -->
                    <div class="input-group-custom">
                        <label for="pay_amount">المبلغ (بالجنيه):</label>
                        <div class="input-wrapper">
                            <input placeholder="أدخل المبلغ المطلوب" 
                                   type="text" 
                                   inputmode="numeric" 
                                   name="amount" 
                                   id="pay_amount" required>
                        </div>
                        <div class="error-message" id="error_amount">يرجى إدخال مبلغ صحيح.</div>
                    </div>

                    <!-- 3. رقم الهاتف / المحفظة -->
                    <div class="input-group-custom" id="phone_group">
                        <label for="user_phone">رقم المحفظة الإلكترونية:</label>
                        <div class="input-wrapper">
                            <input placeholder="01XXXXXXXXX" 
                                   type="text" 
                                   inputmode="numeric" 
                                   name="phone" 
                                   id="user_phone" 
                                   maxlength="11" 
                                   style="padding-right: 85px;">
                            <div class="input-icon-right" id="wallet_icons">
                                <span class="meeza-badge">ميزة Meeza</span>
                                <i class="fa fa-money cash-icon" title="محفظة"></i>
                            </div>
                        </div>
                        <div class="error-message" id="error_phone">يجب كتابة رقم هاتف صحيح 11 رقماً ويبدأ بـ 01.</div>
                    </div>

                    <div class="card-footer-box">
                        <button id="submitButton" type="submit" class="submit-btn">
                            متابعة وتأكيد الدفع
                        </button>

                        <span class="secured-tag"><i class="fa fa-lock" aria-hidden="true"></i> مؤمن بالكامل بواسطة Paymob</span>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <footer>
        <div class="container bank-logos-container">
            <div class="bank-logos-title"><i class="fa fa-shield" aria-hidden="true"></i> معتمد ومؤمن عبر البنوك المصرية والبنك المركزي</div>
            <div class="bank-logos-grid">
                <div class="bank-logo-card" title="البنك المركزي المصري">
                    <img src="https://cbpn.currencyresearch.com/wp-content/uploads/2025/09/CentralBankofEgypt.png.webp" alt="البنك المركزي المصري">
                </div>
            </div>
        </div>
    </footer>

    <script>
        const mikrotikIP = "$(ip)";
        const mikrotikMAC = "$(mac)";
        const mikrotikUsername = "$(username)";

        const internalIP = (mikrotikIP && !mikrotikIP.includes("$(")) ? mikrotikIP : (window.location.hostname || "127.0.0.1");
        const macAddress = (mikrotikMAC && !mikrotikMAC.includes("$(")) ? mikrotikMAC : "غير متوفر";
        const clientUsername = (mikrotikUsername && !mikrotikUsername.includes("$(")) ? mikrotikUsername : "";

        const paymentMethodSelect = document.getElementById('payment_method');
        const phoneGroup = document.getElementById('phone_group');

        function toggleFields() {
            if (paymentMethodSelect.value === 'card') {
                phoneGroup.style.display = 'none';
            } else {
                phoneGroup.style.display = 'block';
            }
        }

        paymentMethodSelect.addEventListener('change', toggleFields);

        window.addEventListener('DOMContentLoaded', () => {
            toggleFields();
            const urlParams = new URLSearchParams(window.location.search);
            const amountParam = urlParams.get('amount');
            if (amountParam) {
                document.getElementById('pay_amount').value = amountParam;
            }
        });

        function convertArabicDigitsToEnglish(str) {
            return str.replace(/[٠-٩]/g, function (d) {
                return d.charCodeAt(0) - 1632;
            });
        }

        const amountInput = document.getElementById('pay_amount');
        amountInput.addEventListener('input', function (e) {
            let val = convertArabicDigitsToEnglish(e.target.value).replace(/[^\d.]/g, '');
            e.target.value = val;
            validateAmount();
        });

        function validateAmount() {
            const val = parseFloat(amountInput.value);
            const errorElement = document.getElementById('error_amount');
            if (isNaN(val) || val <= 0) {
                amountInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                amountInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                return true;
            }
        }

        const phoneInput = document.getElementById('user_phone');
        phoneInput.addEventListener('input', function (e) {
            let val = convertArabicDigitsToEnglish(e.target.value).replace(/\D/g, '');
            if (val.length > 11) val = val.substring(0, 11);
            e.target.value = val;
            validatePhone();
        });

        function validatePhone() {
            if (paymentMethodSelect.value === 'card') return true;
            const val = phoneInput.value;
            const errorElement = document.getElementById('error_phone');
            const isValid = val.length === 11 && val.startsWith('01');

            if (!isValid) {
                phoneInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                phoneInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                return true;
            }
        }

        async function pay(e) {
            if (e) e.preventDefault();

            const isAmountValid = validateAmount();
            const isPhoneValid = validatePhone();

            if (!isAmountValid || !isPhoneValid) return;

            const submitBtn = document.getElementById("submitButton");
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري تحويلك لصفحة الدفع الآمنة...";

            let clientID = localStorage.getItem("clientID");
            if (!clientID) {
                clientID = (clientUsername ? clientUsername + "_" : "DEV_") + Math.random().toString(36).substr(2, 9) + "_" + Date.now();
                localStorage.setItem("clientID", clientID);
            }

            const payload = {
                amount: document.getElementById("pay_amount").value,
                payment_method: paymentMethodSelect.value,
                phone: paymentMethodSelect.value === "wallet" ? document.getElementById("user_phone").value : "غير محدد",
                internalIP: internalIP,
                mac: macAddress,
                clientID: clientID
            };

            try {
                const response = await fetch("/api/pay", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json();

                if (resData.payment_url) {
                    window.location.href = resData.payment_url;
                } else {
                    alert(resData.error || "حدث خطأ أثناء معالجة الدفع.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "متابعة وتأكيد الدفع";
                }
            } catch (err) {
                console.error(" Error processing payment:", err);
                alert("تعذر الاتصال بالسيرفر. يرجى التأكد من الاتصال بالشبكة والمحاولة مجدداً.");
                submitBtn.disabled = false;
                submitBtn.innerText = "متابعة وتأكيد الدفع";
            }
        }

        document.getElementById("paymob_checkout").addEventListener("submit", pay);
    </script>
</body>
</html>
