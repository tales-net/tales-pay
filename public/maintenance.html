<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نحن نقوم بتطوير الخدمة لأجلك | صيانة دورية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #01338D 0%, #0056b3 50%, #002266 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* خلفية مبهجة متحركة */
        .circles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px; height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: animate 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 50px; height: 50px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 3s; }
        .circles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .circles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .circles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .circles li:nth-child(9) { left: 20%; width: 45px; height: 45px; animation-delay: 2s; animation-duration: 35s; }
        .circles li:nth-child(10){ left: 85%; width: 90px; height: 90px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .icon-box {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #fff;
        }

        p {
            font-size: 15px;
            color: #e0e0e0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* تصميم عداد التنازلي الاحترافي */
        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            direction: ltr;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 15px;
            border-radius: 12px;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .time-box span {
            display: block;
            font-size: 26px;
            font-weight: 700;
            color: #ffc107;
        }

        .time-box label {
            font-size: 12px;
            color: #b0c4de;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(40, 167, 69, 0.4);
        }

        /* زر خفي أو خاص لتعديل وقت الصيانة مستقبلاً بسهولة */
        .admin-trigger {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: color 0.3s;
        }
        .admin-trigger:hover {
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="container">
        <div class="icon-box">🛠️</div>
        <h1>نقوم بتحديثات وتحسينات لأجلك!</h1>
        <p>الموقع خاضع حالياً لصيانة دورية لتقديم تجربة أسرع وأفضل. سيتم إعادة فتح الموقع تلقائياً بمجرد انتهاء الوقت أدناه:</p>

        <!-- صندوق العد التنازلي -->
        <div class="countdown-grid">
            <div class="time-box">
                <span id="hours">00</span>
                <label>ساعات</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>دقائق</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>ثواني</label>
            </div>
        </div>

        <div class="status-badge">🔄 جارِ العمل على التحديثات</div>

        <div class="admin-trigger" onclick="setMaintenanceTime()">⚙️ اضبط وقت الصيانة (للمشرف)</div>
    </div>

    <script>
        // دالة لجلب أو تعيين وقت انتهاء الصيانة
        // يمكنك تعديل الوقت الافتراشي هنا، أو الضغط على زر المشرف في الأسفل لتحديد وقت جديد بسهولة
        function getTargetTime() {
            let savedTime = localStorage.getItem("maintenance_end_time");
            
            // إذا لم يتم ضبط وقت مسبقاً، نجعل وقت الصيانة الافتراضي مثلاً بعد 30 دقيقة من الآن
            // أو يمكنك جعله 00:00:00 إذا كنت تريد إيقاف الصيانة تماماً وفتح الموقع
            if (!savedTime) {
                // افتراضياً: 0 يعني لا توجد صيانة مفعلة ويفتح الموقع طبيعياً
                return 0; 
            }
            return parseInt(savedTime, 10);
        }

        function updateCountdown() {
            const targetTime = getTargetTime();
            
            // إذا كان وقت الانتهاء 0 أو مضى وقته، افتح الموقع فوراً
            if (targetTime === 0 || Date.now() >= targetTime) {
                localStorage.removeItem("maintenance_end_time");
                // إعادة توجيه للرئيسية لفتح الموقع بشكل طبيعي
                window.location.href = "/";
                return;
            }

            const now = Date.now();
            const distance = targetTime - now;

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        // زر سري لضبط الوقت عند الحاجة لعمل صيانة جديدة دون تعديل الكود
        function setMaintenanceTime() {
            let minutesInput = prompt("أدخل عدد دقائق الصيانة المطلوبة (مثال: 30 للدقائق، أو اكتب 0 لإلغاء الصيانة وفتح الموقع):");
            if (minutesInput !== null) {
                let mins = parseInt(minutesInput, 10);
                if (mins === 0) {
                    localStorage.removeItem("maintenance_end_time");
                    alert("تم إيقاف الصيانة، سيتم فتح الموقع الآن!");
                    window.location.href = "/";
                } else if (!isNaN(mins) && mins > 0) {
                    let newTarget = Date.now() + (mins * 60 * 1000);
                    localStorage.setItem("maintenance_end_time", newTarget);
                    alert(`تم ضبط وقت الصيانة لمدة ${mins} دقيقة بنجاح!`);
                    location.reload();
                } else {
                    alert("قيمة غير صالحة!");
                }
            }
        }

        // تشغيل العداد فوراً كل ثانية
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
